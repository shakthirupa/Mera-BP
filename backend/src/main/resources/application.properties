# Load backend/.env automatically so `mvnw spring-boot:run` works without a wrapper script
spring.config.import=optional:file:.env[.properties]

spring.application.name=healthcare
server.port=${PORT:8080}
server.address=0.0.0.0

spring.profiles.active=prod
# PostgreSQL connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Email — Brevo HTTP API (no SMTP, works on Render/Railway)
brevo.api.key=${BREVO_API_KEY}
mail.from=${MAIL_FROM:727723euci043@skcet.ac.in}

# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# Jackson — use ISO-8601 strings for java.time types (e.g. "08:30:00" for LocalTime)
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# JWT Configuration
# Secret must be at least 32 characters ? use a strong random string in production
# Never commit the real secret to version control ? use environment variables
jwt.secret=merabp-production-jwt-secret-key-2024-secure-32chars
jwt.expiration-ms=86400000
#jwt.expiration-ms=120000
# 86400000ms = 24 hours
# For testing you can use a shorter value like 3600000 (1 hour)

# Refresh token expiry ? 30 days in milliseconds
jwt.refresh-expiration-ms=2592000000


google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.android-client-id=${GOOGLE_ANDROID_CLIENT_ID}
groq.api-key=${GROQ_API_KEY}
huggingface.api-key=${HUGGINGFACE_API_KEY}
jwt.onboarding-expiration-ms=600000

local.model.url=${LOCAL_MODEL_URL:https://shakthirupan-bandhu-inference.hf.space}
