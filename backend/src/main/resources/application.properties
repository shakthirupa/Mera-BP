# Load backend/.env automatically so `mvnw spring-boot:run` works without a wrapper script
spring.config.import=optional:file:.env[.properties]

spring.application.name=healthcare
server.port=${PORT:8080}
server.address=0.0.0.0

# default profile
spring.profiles.active=local
# PostgreSQL connection
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/healthcare}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=false

# Jackson — use ISO-8601 strings for java.time types (e.g. "08:30:00" for LocalTime)
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# Secret must be at least 32 characters ? use a strong random string in production
# Never commit the real secret to version control ? use environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000
#jwt.expiration-ms=120000
# 86400000ms = 24 hours
# For testing you can use a shorter value like 3600000 (1 hour)

# Refresh token expiry ? 30 days in milliseconds
jwt.refresh-expiration-ms=2592000000


google.client-id=${GOOGLE_CLIENT_ID}
google.client-secret=${GOOGLE_CLIENT_SECRET}
google.android-client-id=${GOOGLE_ANDROID_CLIENT_ID}
jwt.onboarding-expiration-ms=600000


